<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2057"/>
      <stop offset="100%" style="stop-color:#171843"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Equilateral triangle centered at (256,256), side=324 -->
  <polygon points="256,69 418,350 94,350"
            fill="rgba(255,255,255,0.06)"
            stroke="#fff" stroke-width="5" stroke-opacity="0.5"/>

  <!-- Spokes: center to each node -->
  <line x1="256" y1="248" x2="256" y2="69" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="248" x2="406" y2="340" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="248" x2="106" y2="340" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <!-- ===== TOP NODE ===== -->
  <circle cx="256" cy="69" r="56" fill="#fff" opacity="0.95"/>

  <!-- ===== RIGHT NODE ===== -->
  <circle cx="418" cy="350" r="56" fill="#fff" opacity="0.95"/>

  <!-- ===== LEFT NODE ===== -->
  <circle cx="94" cy="350" r="56" fill="#fff" opacity="0.95"/>

  <!-- Center hub -->
  <circle cx="256" cy="248" r="58" fill="#fff" opacity="0.15"/>
  <circle cx="256" cy="248" r="34" fill="#fff" opacity="0.95"/>
</svg>
